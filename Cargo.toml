[package]
name = "nano"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
poise = "0.7.0"
serde_json = "1.0.154"
serenity = "0.12.5"
sqlx = { version = "0.9.0", features = ["postgres", "macros", "migrate", "runtime-tokio"]}
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"]} 
