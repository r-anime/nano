services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.dev

    command: cargo run
    restart: "no"

    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git

    environment:
      TOKEN: ${TOKEN}
      DATABASE_URL: postgres://botuser:${POSTGRES_PASSWORD}@db:5432/nano_db

volumes:
  cargo_registry:
  cargo_git: