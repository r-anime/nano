
services:
  nano:
    image: nano-bot:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TOKEN: ${TOKEN}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      nano_db:
        condition: service_healthy

  nano_db:
    container_name: nano-db
    image: postgres:18.6-alpine
    restart: always
    pull_policy: always
    volumes:
      - ./nano/prod/db-data18:/var/lib/postgresql/18/docker
      - ./nano/prod/backup:/mnt/backup
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s
      start_interval: 1s
