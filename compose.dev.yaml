services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.dev

    command: cargo run
    restart: "no"

    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git

    environment:
      TOKEN: ${TOKEN}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}

volumes:
  cargo_registry:
  cargo_git: